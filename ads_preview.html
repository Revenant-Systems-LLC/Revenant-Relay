<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVSYS // Ad Review</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #111;
            color: #ddd;
            font-family: monospace;
            font-size: 14px;
            padding: 16px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }

        header h1 { font-size: 16px; color: #aaa; letter-spacing: 0.1em; }

        #stats { display: flex; gap: 20px; font-size: 13px; color: #888; }
        #stats span { color: #ccc; }

        #ad-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
            gap: 16px;
        }

        .ad-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ad-card.approved { border-left: 3px solid #4a4; }
        .ad-card.rejected { border-left: 3px solid #a44; }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }

        .card-id { color: #aaa; font-weight: bold; }
        .card-product { color: #666; }

        .status-pill {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 2px;
        }
        .status-pending  { background: #333; color: #888; }
        .status-approved { background: #1a3a1a; color: #6c6; }
        .status-rejected { background: #3a1a1a; color: #c66; }

        .card-meta { color: #555; font-size: 12px; }

        .platform-nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .platform-tab {
            background: #222;
            border: 1px solid #333;
            color: #888;
            padding: 3px 10px;
            font-family: monospace;
            font-size: 12px;
            cursor: pointer;
            border-radius: 2px;
        }

        .platform-tab.active {
            background: #2a2a2a;
            border-color: #555;
            color: #ccc;
        }

        .platform-tab:hover { border-color: #555; color: #ccc; }

        .ad-media {
            position: relative;
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 2px;
            overflow: hidden;
            min-height: 80px;
            max-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ad-media img, .ad-media video {
            max-width: 100%;
            max-height: 240px;
            object-fit: contain;
        }

        .media-placeholder { color: #444; font-size: 12px; text-align: center; padding: 20px; }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            border: 1px solid #444;
            color: #ccc;
            font-size: 18px;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 2px;
        }
        .carousel-btn.prev { left: 4px; }
        .carousel-btn.next { right: 4px; }

        .carousel-dots {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
        }
        .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #555;
            cursor: pointer;
        }
        .dot.active { background: #aaa; }

        textarea.caption {
            width: 100%;
            min-height: 120px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            color: #ccc;
            font-family: monospace;
            font-size: 13px;
            padding: 10px;
            resize: vertical;
            border-radius: 2px;
            line-height: 1.5;
        }

        textarea.caption:focus {
            outline: none;
            border-color: #444;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 8px;
            border: 1px solid #333;
            background: #1e1e1e;
            color: #aaa;
            font-family: monospace;
            font-size: 12px;
            cursor: pointer;
            border-radius: 2px;
            letter-spacing: 0.05em;
        }

        .btn:hover { background: #252525; border-color: #555; color: #ccc; }
        .btn-approve { border-color: #2a4a2a; color: #6c6; }
        .btn-approve:hover { background: #1a2f1a; border-color: #4a4; color: #8e8; }
        .btn-reject  { border-color: #4a2a2a; color: #c66; }
        .btn-reject:hover  { background: #2f1a1a; border-color: #a44; color: #e88; }
    </style>
</head>
<body>

    <header>
        <h1>REVSYS // AD REVIEW</h1>
        <div id="stats">
            TOTAL: <span id="stat-total">—</span> &nbsp;
            PENDING: <span id="stat-pending">—</span> &nbsp;
            APPROVED: <span id="stat-approved">—</span>
        </div>
    </header>

    <div id="ad-grid"></div>

    <script>
        let adsData = [];

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Safe for use inside '...' JS string literals in onclick attributes.
        function escapeAttr(str) {
            return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        async function fetchAds() {
            try {
                const response = await fetch('/api/ads');
                adsData = await response.json();
                renderAds();
                updateStats();
            } catch (err) {
                document.getElementById('ad-grid').innerHTML =
                    '<p style="color:#a44;padding:20px;">Failed to load ads. Is the preview server running?</p>';
                console.error('fetchAds error:', err);
            }
        }

        function updateStats() {
            const total    = adsData.length;
            const approved = adsData.filter(a => a.approved === true).length;
            const pending  = adsData.filter(a => a.approved !== true && a.approved !== false).length;
            document.getElementById('stat-total').innerText    = total;
            document.getElementById('stat-pending').innerText  = pending;
            document.getElementById('stat-approved').innerText = approved;
        }

        async function saveAd(adId, isApprove) {
            const card = document.getElementById(`caption-${adId}`).closest('.ad-card');
            const captions = JSON.parse(card.dataset.captions);

            const textarea = document.getElementById(`caption-${adId}`);
            const activeTab = card.querySelector('.platform-tab.active');
            if (activeTab && textarea) {
                captions[activeTab.innerText.trim().toLowerCase()] = textarea.value;
            }

            const payload = {
                approved: isApprove,
                caption: captions['default'] || '',
                platform_captions: {}
            };
            Object.keys(captions).forEach(k => {
                if (k !== 'default') payload.platform_captions[k] = captions[k];
            });

            try {
                const response = await fetch(`/api/save/${adId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    adsData = adsData.map(ad =>
                        ad.id === adId
                            ? { ...ad, approved: isApprove, caption: payload.caption, platform_captions: payload.platform_captions }
                            : ad
                    );
                    renderAds();
                    updateStats();
                }
            } catch (err) {
                console.error('saveAd error:', err);
            }
        }

        function renderAds() {
            const grid = document.getElementById('ad-grid');
            grid.innerHTML = '';

            adsData.forEach(ad => {
                const card = document.createElement('div');
                const stateClass = ad.approved === true ? 'approved' : ad.approved === false ? 'rejected' : '';
                card.className = `ad-card ${stateClass}`;
                card.id = `card-${ad.id}`;

                // Status
                let statusText  = 'PENDING';
                let statusClass = 'status-pending';
                if (ad.approved === true)  { statusText = 'APPROVED'; statusClass = 'status-approved'; }
                if (ad.approved === false) { statusText = 'REJECTED'; statusClass = 'status-rejected'; }

                // Media
                const mediaPaths = ad.web_media_paths || [];
                let mediaHtml = '';
                if (mediaPaths.length === 0) {
                    mediaHtml = `<div class="media-placeholder">TEXT ONLY</div>`;
                } else {
                    mediaHtml = mediaPaths.map((path, i) => {
                        const isVideo = /\.(mp4|mov|webm)$/i.test(path);
                        return `<div class="carousel-slide" data-index="${i}" style="display:${i===0?'block':'none'};width:100%;height:100%;">
                            ${isVideo
                                ? `<video src="${path}" loop muted playsinline autoplay></video>`
                                : `<img src="${path}" alt="media">`}
                        </div>`;
                    }).join('');
                    if (mediaPaths.length > 1) {
                        const safeId = escapeAttr(ad.id);
                        mediaHtml += `
                            <button class="carousel-btn prev" onclick="moveCarousel('${safeId}',-1,event)">‹</button>
                            <button class="carousel-btn next" onclick="moveCarousel('${safeId}',1,event)">›</button>
                            <div class="carousel-dots">
                                ${mediaPaths.map((_,i) => `<div class="dot ${i===0?'active':''}" onclick="setCarousel('${safeId}',${i},event)"></div>`).join('')}
                            </div>`;
                    }
                }

                // Captions
                const captions = { default: ad.caption || '' };
                if (ad.platform_captions) {
                    Object.keys(ad.platform_captions).forEach(k => { captions[k] = ad.platform_captions[k]; });
                }
                const platforms = ['default', ...(ad.allowed_platforms || []).filter(p => p !== 'default')];

                const safeId = escapeAttr(ad.id);
                const tabsHtml = platforms.map((p, i) =>
                    `<button class="platform-tab ${i===0?'active':''}" onclick="switchPlatform('${safeId}','${escapeAttr(p)}',event)">${escapeHtml(p)}</button>`
                ).join('');

                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <span class="card-id">${escapeHtml(ad.id)}</span>
                            <span class="card-product"> // ${escapeHtml(ad.product || 'SYSTEM')}</span>
                        </div>
                        <span class="status-pill ${statusClass}">${statusText}</span>
                    </div>
                    <div class="card-meta">format: ${escapeHtml(ad.post_format || 'text')} &nbsp;|&nbsp; platforms: ${escapeHtml((ad.allowed_platforms || []).join(', ') || 'none')}</div>
                    <div class="ad-media" id="media-${escapeHtml(ad.id)}">${mediaHtml}</div>
                    <div class="platform-nav">${tabsHtml}</div>
                    <textarea class="caption" id="caption-${escapeHtml(ad.id)}" oninput="updateLocalCaption('${safeId}',event)">${escapeHtml(captions[platforms[0]])}</textarea>
                    <div class="actions">
                        <button class="btn btn-reject"  onclick="saveAd('${safeId}',false)">REJECT</button>
                        <button class="btn"             onclick="saveAd('${safeId}',null)">SAVE DRAFT</button>
                        <button class="btn btn-approve" onclick="saveAd('${safeId}',true)">APPROVE</button>
                    </div>
                `;

                card.dataset.captions     = JSON.stringify(captions);
                card.dataset.currentSlide = '0';
                card.dataset.totalSlides  = mediaPaths.length.toString();

                grid.appendChild(card);
            });
        }

        function updateLocalCaption(adId, event) {
            const card     = event.target.closest('.ad-card');
            const captions = JSON.parse(card.dataset.captions);
            const activeTab = card.querySelector('.platform-tab.active');
            const platform = activeTab ? activeTab.innerText.trim().toLowerCase() : 'default';
            captions[platform] = event.target.value;
            card.dataset.captions = JSON.stringify(captions);
        }

        function switchPlatform(adId, platformKey, event) {
            event.stopPropagation();
            const card     = event.target.closest('.ad-card');
            const captions = JSON.parse(card.dataset.captions);
            const textarea = document.getElementById(`caption-${adId}`);
            const activeTab = card.querySelector('.platform-tab.active');

            if (activeTab && textarea) {
                captions[activeTab.innerText.trim().toLowerCase()] = textarea.value;
            }
            card.querySelectorAll('.platform-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            textarea.value = captions[platformKey] || '';
            card.dataset.captions = JSON.stringify(captions);
        }

        function moveCarousel(adId, direction, event) {
            event.stopPropagation();
            const card  = event.target.closest('.ad-card');
            const total = parseInt(card.dataset.totalSlides);
            let current = (parseInt(card.dataset.currentSlide) + direction + total) % total;
            card.dataset.currentSlide = current.toString();
            updateCarouselDOM(card, current);
        }

        function setCarousel(adId, index, event) {
            event.stopPropagation();
            const card = event.target.closest('.ad-card');
            card.dataset.currentSlide = index.toString();
            updateCarouselDOM(card, index);
        }

        function updateCarouselDOM(card, index) {
            card.querySelectorAll('.carousel-slide').forEach((s, i) => s.style.display = i === index ? 'block' : 'none');
            card.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === index));
        }

        fetchAds();
    </script>
</body>
</html>
